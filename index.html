<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>역사과 수행평가 성적 조회시스템</title>
  <!-- 부드러운 역사 분위기의 구글 고운바탕 폰트 적용 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f7f4ed;
      --card-bg: #fffdfa;
      --border-color: #dcd3c1;
      --primary-color: #8c6b44;
      --primary-hover: #735532;
      --text-dark: #3d3429;
      --text-muted: #7a6e5d;
      --accent-gold: #c5a059;
      --success-green: #2e7d32;
      --success-bg: #e8f5e9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Gowun Batang', serif, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      line-height: 1.6;
      padding: 20px 10px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 950px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(61, 52, 41, 0.08);
      padding: 25px 20px;
      margin-bottom: 20px;
      position: relative;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px dashed var(--border-color);
      padding-bottom: 15px;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--primary-color);
      margin-bottom: 5px;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .top-nav {
      position: absolute;
      top: 20px;
      right: 20px;
    }

    .btn {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #a09382;
    }

    .btn-secondary:hover {
      background-color: #887b6a;
    }

    /* Auth Card */
    .auth-card {
      max-width: 400px;
      margin: 30px auto;
      padding: 25px;
      background: #faf7f0;
      border: 1px solid var(--border-color);
      border-radius: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: var(--text-dark);
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
